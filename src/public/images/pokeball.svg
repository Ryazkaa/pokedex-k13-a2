<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Top Red Dome -->
  <path d="M 6,50 A 44,44 0 0,1 94,50 Z" fill="#FF1C1C"/>
  <!-- Bottom White Dome -->
  <path d="M 6,50 A 44,44 0 0,0 94,50 Z" fill="#FFFFFF"/>
  <!-- Bottom-right soft shadow arc -->
  <path d="M 50,94 A 44,44 0 0,0 94,50 A 41,41 0 0,1 50,94 Z" fill="#DFDFDF"/>
  <!-- Middle Band -->
  <line x1="6" y1="50" x2="94" y2="50" stroke="#000000" stroke-width="7"/>
  <!-- Outer Border -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#000000" stroke-width="7"/>
  <!-- Center Outer Black Circle -->
  <circle cx="50" cy="50" r="15" fill="#000000"/>
  <!-- Center Inner White Button -->
  <circle cx="50" cy="50" r="8.5" fill="#FFFFFF"/>
</svg>
